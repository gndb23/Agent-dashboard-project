name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, build and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Database driver loads
        run: node -e "require('better-sqlite3')(':memory:').prepare('select 1').get(); console.log('sqlite ok')"
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Smoke test (server, API, task sync, create/run/chat agents)
        run: node scripts/smoke.mjs

  windows-installer:
    name: Windows one-click installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run install.ps1 (no shortcuts, no browser)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\install.ps1 -NoStartup -NoShortcuts -NoHooks -NoBrowser -NoUpdate
      - name: Dashboard answers after install
        shell: powershell
        run: |
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:4321/api/health; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { Get-Content data\logs\supervisor.log -ErrorAction SilentlyContinue; Get-Content data\logs\server.log -ErrorAction SilentlyContinue -Tail 50; throw "Agent Ops did not start" }
          foreach ($p in @("/", "/agents", "/settings")) {
            $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4321$p
            if ($r.StatusCode -ne 200) { throw "$p returned $($r.StatusCode)" }
            Write-Host "OK $p"
          }
      - name: Second launch is a no-op (single instance)
        shell: powershell
        run: |
          node scripts\supervisor.mjs
          if ($LASTEXITCODE -ne 0) { throw "second launch failed" }
          Get-Content data\logs\supervisor.log -Tail 3
      - name: Uninstall stops it
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\uninstall.ps1
          Start-Sleep -Seconds 3
          try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:4321/api/health | Out-Null; throw "still running" } catch { if ($_.Exception.Message -eq "still running") { throw } else { Write-Host "stopped" } }
      - name: Logs
        if: always()
        shell: powershell
        run: Get-ChildItem data\logs -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "=== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
